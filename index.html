<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Thunder Unicorn 13</title></head><body>
<canvas id="game"></canvas><div id="ui"><div id="top"><div id="level">等待开始</div><div id="energyBox"><div id="energy"></div></div><div id="energyText">能量系统 ON</div><div id="cooldown">⚡ READY</div></div><div id="players">玩家1 · 0/13</div><div id="score">得分：0</div><div id="hint">移动鼠标/手指瞄准 · 长按蓄力 · 松开发射</div></div>
<div id="startScreen"><h1>⚡ Thunder Unicorn</h1><p>穿过层层云海，按照顺序解救13只独角兽</p><button id="startButton" class="button">开始游戏</button></div>
<button id="debugButton">DEBUG</button><div id="debugPanel"><b>DEBUG</b>
<div class="debugRow"><span>能量系统</span><button id="energyDebug" class="on">ON</button></div><div class="debugRow"><span>射击固定耗能</span><button id="shotEnergyDebug" class="on">ON</button></div><div class="debugRow"><span>黑云机制</span><button id="blackCloudDebug" class="on">ON</button></div><div class="debugRow"><span>目标高亮</span><button id="targetDebug" class="on">ON</button></div><div class="debugRow"><span>高亮提示</span><button id="hintDebug" class="on">ON</button></div><div class="debugRow"><span>云等级显示</span><button id="cloudLevelDebug" class="off">OFF</button></div><div class="debugRow"><span>UI等级显示</span><button id="uiDebug" class="off">OFF</button></div><div class="debugRow"><span>碰撞框</span><button id="collisionDebug" class="off">OFF</button></div><div class="debugRow"><span>抛物线功能</span><button id="trajectoryDebug" class="off">OFF</button></div><div class="debugRow"><span>抛物线显示</span><button id="trajectoryDisplayDebug" class="off">OFF</button></div><div class="debugRow"><span>蓄力抖动</span><button id="shakeDebug" class="on">ON</button></div></div>
<div id="finish"><h1>🌈 13只独角兽全部获救</h1><p id="finalScore">最终得分：0</p><button id="restart" class="button">再来一次</button></div>
<script type="module" src="/src/main.js"></script></body></html>
